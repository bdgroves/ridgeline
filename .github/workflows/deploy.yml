name: RIDGELINE — Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write      # commits the geocode cache + report back
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.41.4
          cache: false

      - name: Fetch Phoenix Fire data
        run: pixi run phoenix

      # Geocoding used to be local-only, so the map showed a hand-exported
      # snapshot. It now runs here against a committed address cache, so only
      # addresses never seen before hit the county geocoder.
      - name: Geocode incidents
        run: pixi run geocode

      - name: Export map incidents
        run: pixi run export

      - name: Scottsdale Fire (mountain + water rescues)
        run: pixi run scottsdale

      - name: Boulder Fire-Rescue (technical + water rescues)
        run: pixi run boulder

      - name: Commit geocode cache, report and incidents
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/external/geocode_cache.csv data/external/*_report.json data/external/*_sar_incidents.geojson
          if git diff --cached --quiet; then echo "No data changes"; else
            git commit -m "chore: refresh geocode cache and map incidents [skip ci]"
            git pull --rebase origin main && git push
          fi

      - name: Fetch GIS layers
        run: pixi run gis

      - name: Statistical analysis
        run: pixi run stats

      - name: WUI model
        run: pixi run model

      - name: Build interactive map
        run: pixi run map

      - name: Build site
        run: pixi run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
