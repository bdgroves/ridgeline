name: Probe data sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/ingest/fetch_nps.py", ".github/workflows/probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx openpyxl pypdf
      - run: python src/ingest/fetch_nps.py
      - name: Commit probe report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/external/nps_*
          git diff --cached --quiet || { git commit -m "chore: data source probe [skip ci]"; git pull --rebase origin main && git push; }
